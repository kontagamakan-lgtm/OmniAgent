# Vérification de types sur le code déjà annoté.
#
# `run_index`, `locking`, `index_doctor`, `replay` et les autres portent des
# annotations que rien ne vérifiait : Ruff ne contrôle que F/B/E9. mypy les
# contrôle désormais, en CI.
#
# Les modules ci-dessous totalisaient 84 erreurs au moment de l'introduction
# (mesure du 21/11/2026). Ils sont explicitement exemptés pour que la garde
# soit verte immédiatement ; ce n'est pas une permission, c'est une dette
# mesurée :
#
#   * cette liste ne doit que rétrécir — retirer une entrée, jamais en ajouter ;
#   * un nouveau module entre dans le périmètre sans exemption ;
#   * les corriger un par un est un travail séparé, chaque retrait étant un
#     progrès visible et vérifiable.
#
# `ignore_errors` (et non `ignore_missing_imports`) : l'import manquant est déjà
# toléré globalement, l'exemption porte bien sur les erreurs de types.

# `python_version` n'est volontairement pas fixé : mypy analyse avec
# l'interpréteur qui l'exécute, comme la matrice de tests qui l'appelle (3.11,
# 3.12, 3.14). Le figer sur 3.11 faisait échouer la lecture des stubs de numpy,
# écrits avec la syntaxe `type` de 3.12.
[mypy]
# Les cibles sont passées explicitement en CI (`core config.py security`).
# Sans `follow_imports = skip`, mypy analyse aussi les modules importés —
# `ui/`, `tools/visual_check` — et le périmètre dépendrait alors des imports
# du jour. Ici, seuls les paquets demandés sont vérifiés.
follow_imports = skip
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
show_error_codes = True
pretty = False

[mypy-config]
ignore_errors = True

[mypy-core.agent_core]
ignore_errors = True

[mypy-core.approval]
ignore_errors = True

