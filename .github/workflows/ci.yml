name: CI Windows

# Vérifie chaque poussée et chaque pull request : style/lint, suite de tests,
# puis construction des deux paquets et contrôles de fumée.
#
# Les jobs `tests` et `build` ne dépendent d'AUCUNE fenêtre affichée : le smoke
# qui attend une fenêtre visible (smoke_exe.py sans option) peut échouer sur un
# runner sans bureau utilisable, sans que l'application soit en cause. La
# construction utilise donc --no-smoke et la CI appelle explicitement les
# auto-contrôles : navigateur système, indexation d'un PDF et OCR en processus.
#
# Seul le job `ui-tk` a besoin d'un bureau : il ouvre de vraies fenêtres Tk et
# capture l'écran. Il est isolé pour que ce besoin ne ralentisse ni ne fragilise
# la matrice Python ni la fabrication des paquets.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Passage nocturne : les tests lents, les trois builds et les contrôles de
  # fumée tournent aussi sans poussée, pour voir une dérive de dépendance ou de
  # fabrication avant qu'un contributeur ne la découvre.
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Trois versions : le code promet 3.11+, et une régression propre à une
    # version (tri, encodage, asyncio, annotations) passerait sinon.
    name: Ruff et pytest (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ci.txt

      - name: Installer les dépendances (versions figées)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-ci.txt

      - name: Ruff (F, B, E9)
        run: >-
          python -m ruff check --select F,B,E9 security tools config.py core
          tests ui app.py smoke_exe.py pyinstaller_recipe.py build_smoke

      # OMNIAGENT_SLOW_TESTS : les tests de concurrence (vrais sous-processus)
      # sont lents et lancés ici plutôt qu'à chaque exécution locale.
      - name: Pytest
        env:
          OMNIAGENT_SLOW_TESTS: "1"
        run: python -m pytest -q

      - name: Smoke test de la boucle ReAct
        run: python build_smoke/agent_loop_smoke.py

      # Golden traces : invariants critiques (reprise sans rejeu d'un effet,
      # approbation, annulation, budget, fenêtre déjà honorée, secret absent
      # du prompt), hors ligne. Lancé aussi par pytest, mais la sortie par
      # scénario reste lisible dans le journal CI et sert de garde explicite.
      - name: Golden traces (hors ligne)
        run: python tests/golden_traces.py

      # Mesure reproductible, seulement la nuit : un index de 100 000 lignes,
      # 2 000 traces, puis compaction/reconstruction/diagnostic. Le facteur
      # laisse de la marge aux runners lents sans masquer une vraie regression.
      - name: Benchmark des traces (nocturne)
        if: github.event_name == 'schedule'
        env:
          BENCHMARK_MAX_FACTOR: "2"
        run: >-
          python tools/benchmark_traces.py --runs 100000 --traces 2000
          --max-seconds 60

  ui-tk:
    # Bureau Windows réel : les tests Tk et les snapshots ouvrent une fenêtre et
    # capturent l'écran. Le runner GitHub fournit un bureau sans écran physique
    # en 1024x768 ; les captures 1280x860 déborderaient, donc le job tente de
    # passer en 1920x1080 avant de lancer les snapshots.
    #
    # Les références visuelles du runner vivent dans artifacts/ui/ci : le rendu
    # (DPI, police, thème) diffère d'un poste de travail, et comparer aux images
    # locales donnerait un écart permanent sans rapport avec le code. Tant que
    # ce dossier est vide, l'étape snapshots ÉCHOUE après avoir enregistré les
    # captures dans l'artefact : télécharger ui-snapshots-windows, committer
    # artifacts/ui/ci, et les exécutions suivantes comparent réellement
    # (tolérance moyenne de 1/255). La CI ne peut donc jamais être verte sans
    # comparaison effective. En cas d'écart, la capture réelle et l'image de
    # différence sont publiées dans le même artefact (artifacts/ui/actual).
    name: Tk et snapshots (bureau Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ci.txt

      - name: Installer les dépendances (versions figées)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-ci.txt

      - name: Préparer l'affichage
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop
          } catch {
            Write-Warning "Resolution non modifiable : $($_.Exception.Message)"
          }
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $session = (Get-Process -Id $PID).SessionId
          Write-Host "session=$session ecran=$($bounds.Width)x$($bounds.Height)"

      - name: Tests Tk (fenêtre réelle)
        env:
          OMNIAGENT_UI_TESTS: "1"
        run: >-
          python -m pytest tests/test_ui_responsive.py tests/test_ui_layout.py -q

      - name: Vérifier que l'écran accueille les snapshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          if ($bounds.Width -lt 1280 -or $bounds.Height -lt 860) {
            throw "Ecran trop petit pour 1280x860 : $($bounds.Width)x$($bounds.Height)"
          }

      # Une référence manquante ou un écart échoue explicitement. Les captures
      # écrites avant l'échec restent publiées par l'upload ci-dessous.
      - name: Snapshots (comparaison obligatoire)
        env:
          OMNIAGENT_UI_SNAPSHOTS: "1"
          OMNIAGENT_UI_SNAPSHOT_DIR: artifacts/ui/ci
          OMNIAGENT_UI_SNAPSHOT_ACTUALS: artifacts/ui/actual
        run: python -m pytest tests/test_ui_snapshots.py -q

      - name: Conserver les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots-windows
          path: |
            artifacts/ui/ci/
            artifacts/ui/actual/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: build.bat --all et contrôles de fumée
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ci.txt

      - name: Installer les dépendances (versions figées)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-ci.txt

      # --no-smoke : pas de recherche de fenêtre visible, impossible à garantir
      # sur un runner sans session interactive. Les contrôles bloquants suivent.
      - name: Construire les deux paquets
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: build.bat --all --no-smoke

      # L'alias --slim est utilisé par d'anciens scripts : le construire ici
      # garantit qu'il ne casse pas sans que personne ne s'en aperçoive. Il ne
      # touche que dist\OmniAgent-slim et reprend la recette de --lite.
      - name: Construire l'alias --slim
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: |
          build.bat --slim --no-smoke || exit /b 1
          if not exist dist\OmniAgent-slim\OmniAgent.exe exit /b 1

      # Chaque contrôle exécute l'exe construit avec son auto-test et exige un
      # marqueur : navigateur réel, PDF indexé, OCR sur une image rendue.
      - name: Contrôles de fumée sans fenêtre (navigateur, index, OCR)
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: |
          python smoke_exe.py --browser --exe dist\OmniAgent\OmniAgent.exe || exit /b 1
          python smoke_exe.py --doc-index --exe dist\OmniAgent\OmniAgent.exe || exit /b 1
          python smoke_exe.py --ocr --exe dist\OmniAgent\OmniAgent.exe || exit /b 1
          python smoke_exe.py --browser --exe dist\OmniAgent-lite\OmniAgent.exe || exit /b 1
          python smoke_exe.py --doc-index --exe dist\OmniAgent-lite\OmniAgent.exe || exit /b 1
          python smoke_exe.py --ocr --exe dist\OmniAgent-lite\OmniAgent.exe || exit /b 1
          python smoke_exe.py --browser --exe dist\OmniAgent-slim\OmniAgent.exe || exit /b 1
          python smoke_exe.py --doc-index --exe dist\OmniAgent-slim\OmniAgent.exe || exit /b 1
          python smoke_exe.py --ocr --exe dist\OmniAgent-slim\OmniAgent.exe || exit /b 1

      # Hors-ligne : un faux fournisseur local fait tourner la boucle d'outils
      # pour vérifier le budget de contexte, et --compat-smoke exerce
      # AgentRunner/run_task/history(run_id)/ToolSpec depuis l'exe. Aucun réseau,
      # aucune fenêtre : compatible avec un runner sans session interactive.
      - name: Budget de contexte et compatibilité dans les exes
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: |
          python build_smoke\offline_smoke.py dist\OmniAgent\OmniAgent.exe || exit /b 1
          python build_smoke\offline_smoke.py dist\OmniAgent-lite\OmniAgent.exe || exit /b 1
          python build_smoke\offline_smoke.py dist\OmniAgent-slim\OmniAgent.exe || exit /b 1

      - name: Taille des paquets
        shell: cmd
        run: >-
          python -c "import os;[(print(d, round(sum(os.path.getsize(os.path.join(r,f)) for r,_,ns in os.walk(d) for f in ns)/1048576,2),'Mio', sum(len(ns) for _,_,ns in os.walk(d)),'fichiers')) for d in ('dist/OmniAgent','dist/OmniAgent-lite','dist/OmniAgent-slim')]"

      # Empreintes SHA-256 et versions de build : un binaire publié reste
      # identifiable et comparable sans reconstruire pour savoir ce qu'il contient.
      - name: Empreintes et versions de build
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: python build_smoke\record_build.py || exit /b 1

      # Seuls les exécutables sont publiés : les trois dossiers complets pèsent
      # ~250 Mio par construction, et deux constructions par jour saturent le
      # quota d'artefacts du dépôt (500 Mio), ce qui faisait échouer aussi les
      # captures d'écran du job `ui-tk`. Rétention courte : un paquet de CI sert
      # à inspecter la construction du jour, pas à archiver les versions.
      - name: Conserver les paquets
        uses: actions/upload-artifact@v4
        with:
          name: omniagent-windows
          path: |
            dist/OmniAgent/OmniAgent.exe
            dist/OmniAgent-lite/OmniAgent.exe
            dist/OmniAgent-slim/OmniAgent.exe
            dist/SHA256SUMS.txt
          retention-days: 1
