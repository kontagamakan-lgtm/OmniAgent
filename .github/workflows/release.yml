name: Publication

# Sur un tag `v*`, rejoue la vérification, construit les trois paquets, les
# compresse et crée une GitHub Release avec les empreintes SHA-256. Le tag doit
# pointer sur un commit déjà passé par la CI : ce workflow revérifie tout de
# même, pour ne jamais publier un binaire non testé.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Construire et publier
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ci.txt

      - name: Installer les dépendances (versions figées)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-ci.txt

      - name: Ruff (F, B, E9)
        run: >-
          python -m ruff check --select F,B,E9 security tools config.py core
          tests ui app.py smoke_exe.py pyinstaller_recipe.py build_smoke

      - name: Pytest
        env:
          OMNIAGENT_SLOW_TESTS: "1"
        run: python -m pytest -q

      - name: Smoke test de la boucle ReAct
        run: python build_smoke/agent_loop_smoke.py

      - name: Construire les trois paquets
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: |
          call build.bat --all --no-smoke || exit /b 1
          call build.bat --slim --no-smoke || exit /b 1
          if not exist dist\OmniAgent-slim\OmniAgent.exe exit /b 1

      - name: Contrôles de fumée sans fenêtre
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: |
          python smoke_exe.py --browser --exe dist\OmniAgent\OmniAgent.exe || exit /b 1
          python smoke_exe.py --doc-index --exe dist\OmniAgent\OmniAgent.exe || exit /b 1
          python smoke_exe.py --ocr --exe dist\OmniAgent\OmniAgent.exe || exit /b 1
          python smoke_exe.py --browser --exe dist\OmniAgent-lite\OmniAgent.exe || exit /b 1
          python smoke_exe.py --doc-index --exe dist\OmniAgent-lite\OmniAgent.exe || exit /b 1
          python smoke_exe.py --ocr --exe dist\OmniAgent-lite\OmniAgent.exe || exit /b 1
          python smoke_exe.py --browser --exe dist\OmniAgent-slim\OmniAgent.exe || exit /b 1
          python smoke_exe.py --doc-index --exe dist\OmniAgent-slim\OmniAgent.exe || exit /b 1
          python smoke_exe.py --ocr --exe dist\OmniAgent-slim\OmniAgent.exe || exit /b 1

      # L'installateur est construit depuis dist\OmniAgent, déjà testé ci-dessus.
      - name: Construire l'installateur Windows
        shell: pwsh
        run: |
          # Version figée : c'est celle qui a produit l'installateur publié.
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe introuvable après installation d'Inno Setup" }
          $version = (Select-String -Path config.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$version" "installer\OmniAgent.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "dist\installer\OmniAgent-$version-Setup.exe"
          if (-not (Test-Path $setup)) { throw "installateur introuvable : $setup" }

      - name: Contrôler l'installateur
        shell: pwsh
        run: |
          $version = (Select-String -Path config.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $setup = (Resolve-Path "dist\installer\OmniAgent-$version-Setup.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "omniagent-install"
          $process = Start-Process -Wait -PassThru -FilePath $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            ("/DIR=`"{0}`"" -f $target)
          )
          if ($process.ExitCode -ne 0) { throw "installation silencieuse : code $($process.ExitCode)" }
          try {
            $app = Start-Process -Wait -PassThru -FilePath (Join-Path $target "OmniAgent.exe") -ArgumentList @("--version")
            if ($app.ExitCode -ne 0) { throw "OmniAgent.exe --version : code $($app.ExitCode)" }
          } finally {
            $uninstaller = Join-Path $target "unins000.exe"
            if (Test-Path $uninstaller) {
              $uninstall = Start-Process -Wait -PassThru -FilePath $uninstaller -ArgumentList @(
                "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
              )
              if ($uninstall.ExitCode -ne 0) { throw "désinstallation silencieuse : code $($uninstall.ExitCode)" }
            }
          }

      # Empreintes et versions de build : un binaire publié reste identifiable
      # et comparable sans reconstruire pour savoir ce qu'il contient.
      - name: Empreintes et versions de build
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: python build_smoke\record_build.py || exit /b 1

      - name: Compresser les paquets
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OmniAgent/* -DestinationPath dist/OmniAgent.zip
          Compress-Archive -Path dist/OmniAgent-lite/* -DestinationPath dist/OmniAgent-lite.zip
          Compress-Archive -Path dist/OmniAgent-slim/* -DestinationPath dist/OmniAgent-slim.zip

      - name: Créer la GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path config.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          gh release create "$env:GITHUB_REF_NAME" `
            dist/OmniAgent.zip dist/OmniAgent-lite.zip dist/OmniAgent-slim.zip `
            "dist/installer/OmniAgent-$version-Setup.exe" `
            dist/SHA256SUMS.txt dist/BUILD-INFO.txt `
            --title "$env:GITHUB_REF_NAME" --generate-notes
