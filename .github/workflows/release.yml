name: Publication

# Sur un tag `v*`, rejoue la vérification, construit les trois paquets, les
# compresse et crée une GitHub Release avec les empreintes SHA-256. Le tag doit
# pointer sur un commit déjà passé par la CI : ce workflow revérifie tout de
# même, pour ne jamais publier un binaire non testé.

on:
  push:
    tags: ["v*"]
  # Republier sans créer de nouveau tag : le tag à publier est saisi à la main
  # et c'est lui qui est extrait, pas la branche depuis laquelle on déclenche.
  # GitHub n'indexe un workflow qu'à l'occasion d'un push qui modifie ce
  # fichier : c'est aussi ce qui le fait apparaître dans la liste.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à republier (ex. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Construire et publier
    runs-on: windows-latest
    # Environnement protégé : un mainteneur doit approuver le déploiement avant
    # que quoi que ce soit ne soit publié. Un tag poussé par erreur s'arrête
    # donc là, au lieu de remplacer les binaires d'une release.
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # En manuel, on construit exactement le tag demandé et non la tête de
          # la branche depuis laquelle le workflow est lancé.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ci.txt

      - name: Installer les dépendances (versions figées)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-ci.txt

      # Deux règles que ce workflow énonçait sans les vérifier : le tag décrit
      # le contenu publié (APP_VERSION nomme l'installateur), et le commit
      # publié a déjà passé la CI. Les contrôler ici évite de dépenser
      # quatre-vingt-dix minutes de construction avant de découvrir l'écart.
      # `RELEASE_FORCE_VERSION_MISMATCH=1` (variable du dépôt) autorise la
      # republication volontaire d'un tag historique.
      - name: Garde-fous de publication (tag, version, CI)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          OMNIAGENT_FORCE_VERSION: ${{ vars.RELEASE_FORCE_VERSION_MISMATCH }}
          OMNIAGENT_SKIP_CI_CHECK: ${{ vars.RELEASE_SKIP_CI_CHECK }}
        shell: bash
        run: >-
          python build_smoke/check_release_gate.py --tag "$RELEASE_TAG"
          --repo "${{ github.repository }}" --sha "$(git rev-parse HEAD)" --require-ci

      - name: Ruff (F, B, E9)
        run: >-
          python -m ruff check --select F,B,E9 security tools config.py core
          tests ui app.py smoke_exe.py pyinstaller_recipe.py build_smoke

      - name: Pytest
        env:
          OMNIAGENT_SLOW_TESTS: "1"
        run: python -m pytest -q

      - name: Smoke test de la boucle ReAct
        run: python build_smoke/agent_loop_smoke.py

      # `OmniAgent-slim.zip` n'est plus publié : c'était exactement le paquet de
      # `OmniAgent-lite.zip` (mêmes exclusions, mêmes 159 Mio), dupliqué à
      # chaque release pour environ 80 Mio d'assets en double. `build.bat
      # --slim` reste disponible localement pour les scripts qui pointent sur
      # `dist\OmniAgent-slim`, mais ne produit plus d'asset. Les releases déjà
      # publiées gardent le leur : rien n'est retiré rétroactivement.
      - name: Construire les deux paquets
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: |
          call build.bat --all --no-smoke || exit /b 1

      - name: Contrôles de fumée sans fenêtre
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: |
          python smoke_exe.py --browser --exe dist\OmniAgent\OmniAgent.exe || exit /b 1
          python smoke_exe.py --doc-index --exe dist\OmniAgent\OmniAgent.exe || exit /b 1
          python smoke_exe.py --ocr --exe dist\OmniAgent\OmniAgent.exe || exit /b 1
          python smoke_exe.py --browser --exe dist\OmniAgent-lite\OmniAgent.exe || exit /b 1
          python smoke_exe.py --doc-index --exe dist\OmniAgent-lite\OmniAgent.exe || exit /b 1
          python smoke_exe.py --ocr --exe dist\OmniAgent-lite\OmniAgent.exe || exit /b 1

      # L'installateur est construit depuis dist\OmniAgent, déjà testé ci-dessus.
      - name: Construire l'installateur Windows
        shell: pwsh
        run: |
          # Version figée : c'est celle qui a produit l'installateur publié.
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe introuvable après installation d'Inno Setup" }
          $version = (Select-String -Path config.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$version" "installer\OmniAgent.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "dist\installer\OmniAgent-$version-Setup.exe"
          if (-not (Test-Path $setup)) { throw "installateur introuvable : $setup" }

      - name: Contrôler l'installateur
        shell: pwsh
        run: |
          $version = (Select-String -Path config.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $setup = (Resolve-Path "dist\installer\OmniAgent-$version-Setup.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "omniagent-install"
          $process = Start-Process -Wait -PassThru -FilePath $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            ("/DIR=`"{0}`"" -f $target)
          )
          if ($process.ExitCode -ne 0) { throw "installation silencieuse : code $($process.ExitCode)" }
          try {
            $app = Start-Process -Wait -PassThru -FilePath (Join-Path $target "OmniAgent.exe") -ArgumentList @("--version")
            if ($app.ExitCode -ne 0) { throw "OmniAgent.exe --version : code $($app.ExitCode)" }
          } finally {
            $uninstaller = Join-Path $target "unins000.exe"
            if (Test-Path $uninstaller) {
              $uninstall = Start-Process -Wait -PassThru -FilePath $uninstaller -ArgumentList @(
                "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
              )
              if ($uninstall.ExitCode -ne 0) { throw "désinstallation silencieuse : code $($uninstall.ExitCode)" }
            }
          }

      # Empreintes et versions de build : un binaire publié reste identifiable
      # et comparable sans reconstruire pour savoir ce qu'il contient.
      - name: Empreintes et versions de build
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: python build_smoke\record_build.py || exit /b 1

      - name: Compresser les paquets
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OmniAgent/* -DestinationPath dist/OmniAgent.zip
          Compress-Archive -Path dist/OmniAgent-lite/* -DestinationPath dist/OmniAgent-lite.zip

      - name: Créer la GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Un déclenchement manuel explique le tag qu'il publie ; un push de tag
          # retombe sur le nom de la référence poussée.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { throw "aucun tag à publier" }
          $version = (Select-String -Path config.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $assets = @(
            "dist/OmniAgent.zip",
            "dist/OmniAgent-lite.zip",
            "dist/installer/OmniAgent-$version-Setup.exe",
            "dist/SHA256SUMS.txt",
            "dist/BUILD-INFO.txt"
          )
          # Relancer une publication déjà existante remplace ses fichiers au lieu
          # d'échouer sur une release qui existe déjà.
          #
          # Le remplacement est destructif : `--clobber` écrase les binaires
          # validés sans en garder copie. Les assets présents sont donc d'abord
          # téléchargés puis republiés sous le préfixe `precedent-`, dans la même
          # release : après une republication malheureuse, l'ancien binaire reste
          # téléchargeable. Ils vivent dans la release et non dans un artefact
          # d'action, dont le quota (500 Mio) fait déjà échouer des jobs.
          $archive = "dist/previous-assets"
          New-Item -ItemType Directory -Force -Path $archive | Out-Null
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release download $tag --dir $archive --clobber
            if ($LASTEXITCODE -ne 0) { throw "téléchargement des assets existants impossible" }
            $keep = @()
            foreach ($file in Get-ChildItem $archive -File) {
              if ($file.Name -like "precedent-*") { continue }
              $copy = Join-Path $archive ("precedent-" + $file.Name)
              Copy-Item $file.FullName $copy -Force
              $keep += $copy
            }
            if ($keep.Count -gt 0) {
              gh release upload $tag @keep --clobber
              if ($LASTEXITCODE -ne 0) { throw "archivage des assets remplacés impossible" }
              Write-Host "Assets précédents conservés sous precedent-* ($($keep.Count))."
            }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
